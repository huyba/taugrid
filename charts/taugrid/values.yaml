# Shared cluster connection recorded once in the Helm release. Portal inherits
# this read-only query identity, never the adx-mon ingestion/admin identity.
global:
  adx:
    queryConnection:
      # Configure all three together; installation creates no Azure resources.
      endpoint: ""
      database: ""
      # Externally provisioned ADX Viewer identity federated to
      # system:serviceaccount:tau-system:tau-portal with the default installation.
      clientID: ""

components:
  kueue:
    enabled: true
  kuberayOperator:
    enabled: true
  tauCoreController:
    enabled: true
  taugridCore:
    enabled: true
  # gpuMonitoring is intentionally absent. Helm evaluates only the first
  # condition path that exists, so while this key is unset the gpu-monitoring
  # subchart follows components.tauCoreController.enabled: a cluster with a Tau
  # control plane always gets GPU node health monitoring. Set it explicitly to
  # decouple them, e.g. --set components.gpuMonitoring.enabled=false.
  #
  # gpuMonitoring:
  #   enabled: true

# Portable baseline queue. These quotas bound concurrent Kueue admission;
# Kubernetes scheduling still enforces the cluster's real capacity.
# Production operators should replace them with deliberate capacity policy.
baselineQueue:
  enabled: true
  name: jobqueue
  namespaceSelector:
    matchExpressions:
      - key: tau.azure.com/workspace
        operator: Exists
  topology:
    enabled: true
    # Owned and reconciled by tau-core-controller.
    name: taugrid-gpu-topology
  flavor:
    name: taugrid-default-cpu
    # The baseline flavor covers CPU and memory only. Keep it free of GPU labels
    # and GPU taint tolerations so CPU-only workloads remain on general-purpose
    # nodes when the cluster also has tainted GPU pools. When topology is
    # enabled, the chart attaches a hostname-only taugrid-cpu-topology so Tau's
    # unconstrained CPU placement contract is accepted without requiring GPU
    # site, network-domain, or accelerator-domain labels.
    nodeLabels:
      kubernetes.io/os: linux
    tolerations: []
  resources:
    - name: cpu
      nominalQuota: "100000"
    - name: memory
      nominalQuota: 100Ti
  gpu:
    enabled: true
    coveredResources:
      - nvidia.com/gpu
      - tau.azure.com/torchrun-host-slot
    # When GPU admission, topology, and tau-core-controller are enabled, the
    # controller discovers one topology-aware ResourceFlavor per GPU class and
    # grows its quota from live allocatable capacity. Existing discovered
    # flavors and quota are retained when pools scale to zero.
    # Configure this list only to retain externally managed custom flavors.
    flavors: []

kueue:
  # TauGrid installs the Kueue MultiKueue capability by default. Operators still
  # own worker credentials, routing objects, and multi-cluster queue policy.
  aksExtension:
    enableMultiKueue: true
  controllerManager:
    manager:
      image:
        repository: mcr.microsoft.com/oss/v2/kueue/kueue
        tag: v0.19.2
        pullPolicy: IfNotPresent
  # Keep the active upstream configuration when replacing this embedded YAML
  # string, and include the AKS DRA device-class mapping used by the published
  # Kueue fork.
  managerConfig:
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 5
          LocalQueue.kueue.x-k8s.io: 1
          ClusterQueue.kueue.x-k8s.io: 1
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 50
        burst: 100
      integrations:
        frameworks:
          - batch/job
          - kubeflow.org/mpijob
          - ray.io/rayjob
          - ray.io/rayservice
          - ray.io/raycluster
          - jobset.x-k8s.io/jobset
          - trainer.kubeflow.org/trainjob
          - kubeflow.org/paddlejob
          - kubeflow.org/pytorchjob
          - kubeflow.org/tfjob
          - kubeflow.org/xgboostjob
          - kubeflow.org/jaxjob
          - workload.codeflare.dev/appwrapper
          - pod
          - deployment
          - statefulset
          - leaderworkerset.x-k8s.io/leaderworkerset
      resources:
        deviceClassMappings:
          - name: gpu.nvidia.com
            deviceClassNames:
              - gpu.nvidia.com

kuberay-operator:
  image:
    repository: mcr.microsoft.com/oss/v2/kuberay/operator
    tag: v1.6.2
    pullPolicy: IfNotPresent
  podAnnotations:
    adx-mon/scrape: "true"
    adx-mon/port: "8080"
  configuration:
    enabled: true
    defaultContainerEnvs:
      - name: RAY_DATA_DISABLE_PROGRESS_BARS
        value: "1"
      - name: RAY_metric_cardinality_level
        value: recommended

# The Tau control plane image is publicly available from MCR. The subchart
# defaults to the release tag matching its chart version.
tau-core-controller:
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
    pullPolicy: IfNotPresent
  tauCluster:
    # Inherits the controller chart's reviewed AKS GPU VM-size catalog, which
    # reconciles gpu-class and gpu-series labels from instance-type. Append
    # cluster-specific hardware without replacing that catalog.
    extraNodeLabelRules: []
# Portal is part of the default operator experience. The remaining first-party
# services stay opt-in and all enabled services use release-versioned MCR tags.
taugrid-core:
  prewarm:
    enabled: false
  stellar:
    enabled: false
  portal:
    enabled: true
    # Browser login remains opt-in. See the Portal Entra setup guide for the
    # required external identity, cookie Secret, issuer, DNS and Gateway controller.
    entraAuth:
      enabled: false
    serviceAccount:
      create: true
      name: tau-portal
    rbac:
      create: true
  lifecycleRecorder:
    enabled: false

# Capacity-aware admission via Kueue ProvisioningRequest AdmissionCheck.
# When enabled, Kueue reserves quota then waits for Cluster Autoscaler to
# confirm atomic scale-up before admitting any workload on the GPU flavor.
# Disabled by default; quota-only admission remains the default install.
#
# To enable:
#   helm upgrade taugrid . --set capacityAwareAdmission.enabled=true \
#     --set capacityAwareAdmission.gpuFlavor.agentPool=<your-agentpool> \
#     --set capacityAwareAdmission.gpuFlavor.instanceType=<aks-vm-size>
capacityAwareAdmission:
  enabled: false

  # AKS provisioning class. best-effort-atomic-scale-up enforces gang semantics
  # at the node level: all-or-nothing. The check-capacity class only tests nodes
  # that already exist and cannot scale from zero; do not use it here.
  provisioningClass: best-effort-atomic-scale-up.autoscaling.x-k8s.io

  admissionCheck:
    name: taugrid-provisioning-admission-check
    # Rendered into ProvisioningRequestConfig.spec.retryStrategy.
    # Kueue retries a failed ProvisioningRequest up to retryLimit times.
    retryLimit: 3
    # Exponential back-off window between retries (seconds).
    minBackoffSeconds: 60
    maxBackoffSeconds: 1800

  provisioningRequestConfig:
    name: taugrid-provisioning-request-config
    # Resources tracked by CA for capacity decisions. GPU quota is the only
    # resource that currently gates scale-from-zero on AKS.
    managedResources:
      - nvidia.com/gpu
    # CA must set Provisioned=True within this many seconds or the booking expires.
    bookingExpirationSeconds: 600

  gpuFlavor:
    # Name for the scale-from-zero ResourceFlavor added alongside the default GPU flavor.
    name: taugrid-gpu-scale-from-zero
    # AKS agentpool label value. Must match the kubernetes.azure.com/agentpool
    # label applied by the Terraform node pool definition.
    agentPool: gpupool
    # Optional: pin to a specific VM SKU. Leave empty to match all GPU nodes
    # in the agentPool (useful when the pool contains a single SKU).
    instanceType: ""
