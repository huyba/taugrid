---
# StorageClass: Azure Files Premium with NFS 4.1
# Mount options tuned for distributed AI training I/O patterns:
#   nconnect=4          — 4 parallel TCP connections per NFS mount
#   rsize/wsize=1048576 — 1 MiB read/write block size (max for NFS 4.1)
#   hard                — retransmit indefinitely on server unreachable
#   noresvport          — allow kernel to pick ephemeral source ports
#   nodiratime          — skip atime updates on directory access
#
# IMPORTANT: Azure Files Premium NFS requires:
#   - VNet service endpoint or Private Endpoint to storage account
#   - Storage account with "Secure transfer required" = false (NFS limitation)
#   - Node subnet delegated for NFS traffic
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-premium-nfs
provisioner: file.csi.azure.com
parameters:
  skuName: Premium_LRS
  protocol: nfs
  networkEndpointType: privateEndpoint
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nconnect=4
  - rsize=1048576
  - wsize=1048576
  - hard
  - noresvport
  - nodiratime
---
# PersistentVolumeClaim: Shared State Volume
# Generated by the DataFetch controller for spec.sharedState.
# Shown here as a reference for manual cluster setup or CI validation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vision-llm-run-001-shared-state
  namespace: research-team-a
  labels:
    tau.azure.com/data-fetch: vision-llm-run-001
    tau.azure.com/storage-tier: shared-state
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-premium-nfs
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
---
# PersistentVolumeClaim: Checkpoint Staging Volume
# Azure Premium SSD (managed-csi-premium) — ReadWriteOnce for maximum
# sequential write throughput during checkpoint saves.
# The async sidecar drains this to Azure Blob in the background.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vision-llm-run-001-checkpoints
  namespace: research-team-a
  labels:
    tau.azure.com/data-fetch: vision-llm-run-001
    tau.azure.com/storage-tier: checkpoint
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi-premium
  volumeMode: Filesystem
  resources:
    requests:
      storage: 200Gi
