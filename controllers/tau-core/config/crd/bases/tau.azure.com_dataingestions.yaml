---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: dataingestions.tau.azure.com
spec:
  group: tau.azure.com
  names:
    kind: DataIngestion
    listKind: DataIngestionList
    plural: dataingestions
    shortNames:
    - di
    singular: dataingestion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.workspace
      name: Workspace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DataIngestion is the Schema for the managed storage layer CRD.
          It declaratively describes all storage tiers required by a TauGrid training
          workload (HotLoad datasets, asynchronous checkpoint sync, high-throughput
          shared NFS state).
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: DataIngestionSpec is the desired state of a DataIngestion resource.
            properties:
              checkpoints:
                description: Checkpoints configures how model checkpoints are staged
                  locally and synchronised to Azure Blob Storage.
                properties:
                  localPath:
                    description: LocalPath is the directory inside the training container
                      where checkpoint files are written.
                    minLength: 1
                    type: string
                  remote:
                    description: Remote is the Azure Blob Storage target for async upload.
                    properties:
                      container:
                        minLength: 1
                        type: string
                      credentialSecretRef:
                        description: CredentialSecretRef optionally points to a Secret
                          holding a storage account key or SAS token.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      prefix:
                        type: string
                      storageAccount:
                        minLength: 3
                        type: string
                    required:
                    - container
                    - storageAccount
                    type: object
                  retentionCount:
                    default: 2
                    description: RetentionCount is the max number of checkpoint sets
                      to keep locally before eviction.
                    minimum: 1
                    type: integer
                  syncStrategy:
                    default: Asynchronous
                    description: SyncStrategy controls the persistence mechanism.
                    enum:
                    - Asynchronous
                    type: string
                  uploadRetryMaxAttempts:
                    default: 10
                    description: UploadRetryMaxAttempts caps the sidecar retry loop.
                    minimum: 1
                    type: integer
                required:
                - localPath
                - remote
                type: object
              datasets:
                description: Datasets lists one or more training datasets to provision.
                items:
                  description: DatasetSpec describes a training dataset.
                  properties:
                    loadStrategy:
                      default: HotLoad
                      description: |-
                        LoadStrategy controls how data is delivered to the training pod.
                        HotLoad streams data to node-local NVMe via an init container.
                        StreamMount falls back to a BlobFuse2 CSI network mount.
                      enum:
                      - HotLoad
                      - StreamMount
                      type: string
                    mountPath:
                      description: MountPath is the filesystem path inside training containers.
                      minLength: 1
                      type: string
                    name:
                      description: Name is the unique identifier for this dataset.
                      minLength: 1
                      type: string
                    sizeGB:
                      description: SizeGB is the estimated uncompressed dataset size in GiB.
                      minimum: 1
                      type: integer
                    source:
                      description: Source is the Azure Blob Storage location.
                      properties:
                        container:
                          minLength: 1
                          type: string
                        credentialSecretRef:
                          properties:
                            key:
                              minLength: 1
                              type: string
                            name:
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        prefix:
                          type: string
                        storageAccount:
                          minLength: 3
                          type: string
                      required:
                      - container
                      - storageAccount
                      type: object
                  required:
                  - mountPath
                  - name
                  - source
                  type: object
                minItems: 1
                type: array
              nvmeCapacityGiB:
                default: 3000
                description: NVMeCapacityGiB is the assumed per-node NVMe capacity
                  for HotLoad feasibility checks. Defaults to 3000 GiB.
                minimum: 1
                type: integer
              nvmeNodeSelector:
                additionalProperties:
                  type: string
                description: NVMeNodeSelector constrains which nodes are eligible
                  for HotLoad caching.
                type: object
              sharedState:
                description: SharedState configures the ReadWriteMany NFS volume for
                  distributed training coordination.
                properties:
                  capacity:
                    default: 100Gi
                    description: Capacity is the PVC storage request (e.g. "100Gi").
                    minLength: 1
                    type: string
                  mountPath:
                    description: MountPath is the filesystem path inside training containers.
                    minLength: 1
                    type: string
                  storageClassName:
                    description: StorageClassName overrides the Azure Files Premium
                      NFS storage class. Defaults to azurefile-premium-nfs.
                    type: string
                  type:
                    default: HighThroughputNFS
                    description: Type must be HighThroughputNFS.
                    enum:
                    - HighThroughputNFS
                    type: string
                required:
                - mountPath
                type: object
              workspace:
                description: Workspace is the name of the TauWorkspace this DataIngestion
                  is scoped to.
                minLength: 1
                type: string
            required:
            - workspace
            type: object
          status:
            description: DataIngestionStatus is the observed state of a DataIngestion resource.
            properties:
              checkpointPVCName:
                description: CheckpointPVCName is the Premium SSD PVC for checkpoint staging.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              datasets:
                description: Datasets contains per-dataset status after reconcile.
                items:
                  properties:
                    effectiveLoad:
                      description: EffectiveLoad is the load strategy actually applied.
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      type: string
                    pvcName:
                      type: string
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase summarises the overall provisioning state.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                type: string
              sharedStatePVCName:
                description: SharedStatePVCName is the Azure Files NFS PVC for shared
                  state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
